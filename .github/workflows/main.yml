name: Simulator
on: [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: ["linux/amd64", "windows/amd64"]
        include:
          - platform: "linux/amd64"
            os: ubuntu-latest
            name: nmea-sim-linux
            nsis: false
          - platform: "windows/amd64"
            os: windows-latest
            name: nmea-sim-win.exe
            nsis: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dAppServer/wails-build-action@main
        with:
          build-name: ${{ matrix.name }}
          build-platform: ${{ matrix.platform }}
          wails-version: "v2.9.0"
          package: true
          nsis: ${{ matrix.nsis }}

      - name: Setup Java for CodeSignTool
        if: matrix.platform == 'windows/amd64'
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'
          
      - name: Download SSL.com CodeSignTool
        if: matrix.platform == 'windows/amd64'
        shell: powershell
        run: |
          # Use the known working direct download URL for CodeSignTool
          $url = "https://www.ssl.com/download/codesigntool-for-windows/"
          $response = Invoke-WebRequest -Uri $url -UseBasicParsing
          $downloadLink = $response.Links | Where-Object { $_.href -like "*CodeSignTool*" -or $_.href -like "*.zip" } | Select-Object -First 1
          
          if ($downloadLink) {
            $downloadUrl = $downloadLink.href
            if ($downloadUrl -notmatch '^https?://') {
              $downloadUrl = "https://www.ssl.com" + $downloadUrl
            }
            Write-Host "Downloading from: $downloadUrl"
            Invoke-WebRequest -Uri $downloadUrl -OutFile "CodeSignTool.zip"
          } else {
            # Try alternative known URL
            Write-Host "Trying alternative download method..."
            Invoke-WebRequest -Uri "https://github.com/SSLcom/esigner-codesign/releases/latest/download/CodeSignTool.zip" -OutFile "CodeSignTool.zip" -ErrorAction SilentlyContinue
          }
          
          if (Test-Path "CodeSignTool.zip") {
            Expand-Archive -Path "CodeSignTool.zip" -DestinationPath "." -Force
            Get-ChildItem -Recurse -Include "*.jar", "*.bat", "*.exe"
          } else {
            Write-Error "Failed to download CodeSignTool"
            exit 1
          }
          
      - name: Sign Windows Binary with SSL.com
        if: matrix.platform == 'windows/amd64'
        shell: powershell
        run: |
          # Look for CodeSignTool JAR file (Java-based tool)
          $jarFile = Get-ChildItem -Recurse -Filter "CodeSignTool*.jar" | Select-Object -First 1
          
          if ($jarFile) {
            Write-Host "Using CodeSignTool JAR: $($jarFile.FullName)"
            java -jar $jarFile.FullName sign -input_file_path="${{ github.workspace }}\build\bin\${{ matrix.name }}" -username="${{ secrets.ES_USERNAME }}" -password="${{ secrets.ES_PASSWORD }}" -credential_id="${{ secrets.CREDENTIAL_ID }}" -totp_secret="${{ secrets.ES_TOTP_SECRET }}"
          } else {
            Write-Error "CodeSignTool JAR not found"
            Get-ChildItem -Recurse
            exit 1
          }
