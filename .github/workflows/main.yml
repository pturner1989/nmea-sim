name: Simulator
on: [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: ["linux/amd64", "windows/amd64"]
        include:
          - platform: "linux/amd64"
            os: ubuntu-latest
            name: nmea-sim
            nsis: false
          - platform: "windows/amd64"
            os: windows-latest
            name: nmea-sim.exe
            nsis: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dAppServer/wails-build-action@main
        with:
          build-name: ${{ matrix.name }}
          build-platform: ${{ matrix.platform }}
          wails-version: "v2.9.0"
          package: true
          nsis: ${{ matrix.nsis }}

      - name: Download and Install SSL.com CodeSignTool
        if: matrix.platform == 'windows/amd64'
        shell: powershell
        run: |
          # Download CodeSignTool from the direct download link
          Invoke-WebRequest -Uri "https://github.com/SSLcom/CodeSignTool/releases/download/1.3.0/CodeSignTool-1.3.0-windows.zip" -OutFile "CodeSignTool.zip"
          Expand-Archive -Path "CodeSignTool.zip" -DestinationPath "CodeSignTool" -Force
          # List contents to verify extraction
          Get-ChildItem -Path "CodeSignTool" -Recurse
          
      - name: Sign Windows Binary with SSL.com
        if: matrix.platform == 'windows/amd64'
        shell: powershell
        run: |
          # Use full path to CodeSignTool
          $toolPath = Join-Path $PWD "CodeSignTool\CodeSignTool.bat"
          if (Test-Path $toolPath) {
            & $toolPath sign -input_file_path="${{ github.workspace }}\build\bin\${{ matrix.name }}" -username="${{ secrets.ES_USERNAME }}" -password="${{ secrets.ES_PASSWORD }}" -credential_id="${{ secrets.CREDENTIAL_ID }}" -totp_secret="${{ secrets.ES_TOTP_SECRET }}"
          } else {
            Write-Error "CodeSignTool.bat not found at $toolPath"
            Get-ChildItem -Path "CodeSignTool" -Recurse
          }
