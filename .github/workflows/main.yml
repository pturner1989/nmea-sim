name: Simulator
on: 
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: 'Create signed package'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  package:
    strategy:
      matrix:
        platform: [ubuntu-latest]
        go-version: [1.24]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v3
      - name: Install Go
        uses: actions/setup-go@v2
        with:
          go-version: ${{ matrix.go-version }}
      - name: setup node
        uses: actions/setup-node@v2
        with:
          node-version: 20
      # You may need to manually build you frontend manually here, unless you have configured frontend build and install commands in wails.json.
      - name: Install NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
          
      - name: Get Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
        
      - name: Build Wails app
        run: |
          wails build -tags webkit2_41 -platform windows -nsis
      - name: Sign Application with CodeSignTool
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.package == 'true' }}
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{secrets.ES_USERNAME}}
          password: ${{secrets.ES_PASSWORD}}
          credential_id: ${{secrets.CREDENTIAL_ID}}
          totp_secret: ${{secrets.ES_TOTP_SECRET}}
          file_path: ${GITHUB_WORKSPACE}/build/bin/route-sim.exe
          override: true
          malware_block: false
          
      - name: Sign Installer with CodeSignTool
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.package == 'true' }}
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{secrets.ES_USERNAME}}
          password: ${{secrets.ES_PASSWORD}}
          credential_id: ${{secrets.CREDENTIAL_ID}}
          totp_secret: ${{secrets.ES_TOTP_SECRET}}
          file_path: ${GITHUB_WORKSPACE}/build/bin/route-sim-amd64-installer.exe
          override: true
          malware_block: false
          
      - name: Upload Assets to Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.package == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create release assets
          cd build/bin
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Tagged release - upload to existing release
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "Uploading to existing release: $TAG_NAME"
            
            # Upload individual files to the release
            gh release upload "$TAG_NAME" route-sim.exe --clobber
            gh release upload "$TAG_NAME" route-sim-amd64-installer.exe --clobber
          fi
          
      - name: upload artifacts windows
        uses: actions/upload-artifact@v4
        with:
          name: wails-binaries-windows
          path: build/bin/*